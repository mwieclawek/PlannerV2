version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - plannerv2-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-planner}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-planner_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plannerv2-network

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-planner}:${RABBITMQ_DEFAULT_PASS:-planner_secret}@rabbitmq:5672/}
      - USE_ASYNC_WORKER=${USE_ASYNC_WORKER:-true}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - MANAGER_REGISTRATION_PIN=${MANAGER_REGISTRATION_PIN:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/firebase-admin-key.json}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-}
    networks:
      - plannerv2-network

  solver-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.solver
    command: python -m app.workers.solver_worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-planner}:${RABBITMQ_DEFAULT_PASS:-planner_secret}@rabbitmq:5672/}
      - USE_ASYNC_WORKER=true
      - PYTHONPATH=/app/backend:/app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - plannerv2-network

  analytics-worker:
    build: ./backend
    command: python -m app.workers.wfm_analytics_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-planner}:${RABBITMQ_DEFAULT_PASS:-planner_secret}@rabbitmq:5672/}
      - USE_ASYNC_WORKER=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PYTHONPATH=/app/backend:/app
    networks:
      - plannerv2-network

  nginx:
    build:
      context: ./frontend
      args:
        FLUTTER_ENV: ${FLUTTER_ENV:-dev}
        FCM_VAPID_KEY: ${FCM_VAPID_KEY:-}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/var/www/plannerv2/static:ro
    depends_on:
      - backend
    networks:
      - plannerv2-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  plannerv2-network:
    driver: bridge
