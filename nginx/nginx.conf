events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ── Rate limiting (brute-force / DoS protection) ─────────────────────────────
    # 10 requests per minute per client IP for auth endpoints and bug reports.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    # Do not advertise the nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    server {
        listen 80;
        server_name _;

        # Reject oversized request bodies early (bug reports, uploads, JSON payloads)
        client_max_body_size 5M;
        
        # Security Headers
        # Note: Strict-Transport-Security (HSTS) is only effective with HTTPS.
        # Configure TLS/SSL at the reverse proxy level (e.g., in a separate Nginx block or cloud load balancer).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        
        # Privacy Policy (publicly accessible, no login required)
        location = /privacy {
            alias /var/www/plannerv2/static/privacy.html;
            default_type text/html;
            add_header Cache-Control "public, max-age=3600";
        }

        # About / Landing Page (publicly accessible, no login required)
        location = /about {
            alias /var/www/plannerv2/static/about.html;
            default_type text/html;
            add_header Cache-Control "public, max-age=3600";
        }

        # Service workers must never be cached by browsers or reverse proxies
        location = /firebase-messaging-sw.js {
            root /var/www/plannerv2/web;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            expires 0;
        }

        location = /flutter_service_worker.js {
            root /var/www/plannerv2/web;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            expires 0;
        }

        # Flutter web app (static files)
        location / {
            root /var/www/plannerv2/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        
        # API endpoints
        # Login / token refresh / logout: strictly rate limited (burst allows a few quick retries)
        location /auth {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /manager {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /employee {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /scheduler {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bug reports create GitHub issues: same strict limit, must match BEFORE the generic /api block
        location = /api/bug-report {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /bug-report {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://plannerv2-backend:8000/api/bug-report;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /kitchen {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Global SuperAdmin API (Flutter UI lives under /#/superadmin - no collision)
        location /sysadmin {
            proxy_pass http://plannerv2-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # API docs direct access
        location /docs {
            proxy_pass http://plannerv2-backend:8000/docs;
            proxy_set_header Host $host;
        }
        
        location /openapi.json {
            proxy_pass http://plannerv2-backend:8000/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
